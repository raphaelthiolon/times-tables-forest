<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Engine tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
  .pass { color: #0a7a3d; } .fail { color: #b00020; font-weight: 600; }
  h1 { font-size: 20px; }
</style>
</head>
<body>
<h1>Engine tests</h1>
<p id="summary">Running...</p>
<ul id="out"></ul>
<script src="../engine.js"></script>
<script>
(function () {
  var E = window.Engine;
  var results = [];
  function test(name, fn) {
    var ok = true, msg = '';
    try { fn(); } catch (e) { ok = false; msg = e.message; }
    results.push({ name: name, ok: ok, msg: msg });
  }
  function assert(c, m) { if (!c) throw new Error(m || 'assertion failed'); }
  function mulberry(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  var DAY = 86400000, T0 = new Date(2026, 10, 6, 12).getTime();

  // Build the right (or a wrong) response for any question type, including interludes.
  function respond(q, ok) {
    var p = q.a * q.b, it = q.interlude;
    if (!it) return ok ? String(p) : '1';
    if (it.type === 'firefly') return ok ? p : it.options.filter(function (o) { return o !== p; })[0];
    if (it.type === 'spot') return ok ? it.isCorrect : !it.isCorrect;
    return ok ? String(q.a) : '1';
  }

  test('fact set: 28 unique facts from 3-9, 10 hard facts all inside it', function () {
    assert(E.ALL.length === 28, 'expected 28, got ' + E.ALL.length);
    assert(E.HARD.length === 10);
    E.HARD.forEach(function (k) { assert(E.ALL.indexOf(k) >= 0, k); });
    var expected = ['6x6','6x7','6x8','6x9','7x7','7x8','7x9','8x8','8x9','9x9'];
    assert(JSON.stringify(E.HARD) === JSON.stringify(expected));
    // hard = both factors 6..9
    E.ALL.forEach(function (k) {
      var p = E.parse(k);
      assert(E.isHard(k) === (p[0] >= 6 && p[1] >= 6), k);
    });
  });

  test('answer checker: all 49 products, both orders, right and wrong', function () {
    var n = 0;
    for (var a = 3; a <= 9; a++) for (var b = 3; b <= 9; b++) {
      var p = a * b;
      assert(E.checkAnswer(a, b, String(p)), a + 'x' + b + ' should accept ' + p);
      assert(E.checkAnswer(a, b, p), 'numeric input ' + a + 'x' + b);
      assert(!E.checkAnswer(a, b, String(p + 1)), 'rejects p+1');
      assert(!E.checkAnswer(a, b, String(p - 1)), 'rejects p-1');
      assert(!E.checkAnswer(a, b, ''), 'rejects empty');
      assert(E.answerOf(E.key(a, b)) === p, 'answerOf');
      n++;
    }
    assert(n === 49);
  });

  test('answer checker: also correct over the full 1-10 grid (1x1 to 10x10)', function () {
    for (var a = 1; a <= 10; a++) for (var b = 1; b <= 10; b++) {
      assert(E.checkAnswer(a, b, String(a * b)));
      assert(!E.checkAnswer(a, b, String(a * b + 1)));
    }
  });

  test('hints: every hint ends in the correct product', function () {
    for (var a = 3; a <= 9; a++) for (var b = 3; b <= 9; b++) {
      var h = E.hintFor(a, b);
      var m = h.match(/(\d+)\.$/);
      assert(m && Number(m[1]) === a * b, a + 'x' + b + ': ' + h);
    }
  });

  test('mastery: fast correct raises score, slow raises less, wrong lowers', function () {
    var s = E.newState(); var k = '7x8';
    var s0 = s.facts[k].score;
    E.recordAnswer(s, k, true, 1500, { now: T0 });
    var s1 = s.facts[k].score;
    assert(s1 > s0, 'fast up');
    E.recordAnswer(s, k, true, 9000, { now: T0 });
    var s2 = s.facts[k].score;
    assert(s2 > s1 && (s2 - s1) < (s1 - s0), 'slow up, less than fast');
    E.recordAnswer(s, k, false, 3000, { now: T0 });
    assert(s.facts[k].score < s2, 'wrong down');
    for (var i = 0; i < 20; i++) E.recordAnswer(s, k, false, 3000, { now: T0 });
    assert(s.facts[k].score === 0, 'floor at 0');
    for (i = 0; i < 20; i++) E.recordAnswer(s, k, true, 1000, { now: T0 });
    assert(s.facts[k].score === 1, 'cap at 1');
  });

  test('mastery gate: needs fast-correct on 3 different days; same day twice does not count', function () {
    var s = E.newState(); var k = '6x7';
    E.recordAnswer(s, k, true, 2000, { now: T0 });
    E.recordAnswer(s, k, true, 2000, { now: T0 + 1000 });
    assert(s.facts[k].fastDays.length === 1, 'one day');
    assert(E.statusOf(s, k) !== 'mastered');
    E.recordAnswer(s, k, true, 2000, { now: T0 + DAY });
    assert(E.statusOf(s, k) !== 'mastered', 'two days is not enough');
    E.recordAnswer(s, k, true, 2000, { now: T0 + 2 * DAY });
    assert(E.statusOf(s, k) === 'mastered', 'three days');
    assert(E.hardMasteredCount(s) === 1);
  });

  test('mastery gate: slow answers (4 s or more) never count as a mastery day', function () {
    var s = E.newState(); var k = '6x8';
    for (var d = 0; d < 5; d++) E.recordAnswer(s, k, true, 4000, { now: T0 + d * DAY });
    assert(s.facts[k].fastDays.length === 0);
    E.recordAnswer(s, k, true, 3999, { now: T0 + 6 * DAY });
    assert(s.facts[k].fastDays.length === 1);
  });

  test('a miss removes one mastery day', function () {
    var s = E.newState(); var k = '8x9';
    for (var d = 0; d < 3; d++) E.recordAnswer(s, k, true, 1500, { now: T0 + d * DAY });
    assert(E.statusOf(s, k) === 'mastered');
    E.recordAnswer(s, k, false, 3000, { now: T0 + 3 * DAY });
    assert(E.statusOf(s, k) !== 'mastered');
  });

  test('time spent looking away is capped at 15 s', function () {
    var s = E.newState();
    var r = E.recordAnswer(s, '9x9', true, 120000, { now: T0 });
    assert(r.ms === 15000);
  });

  test('diagnostic answers set the starting level but never count as mastery days', function () {
    var s = E.newState();
    E.recordAnswer(s, '7x9', true, 1500, { now: T0, diagnostic: true });
    assert(s.facts['7x9'].fastDays.length === 0);
    assert(s.facts['7x9'].score === 0.6);
    E.recordAnswer(s, '6x9', false, 5000, { now: T0, diagnostic: true });
    assert(s.facts['6x9'].score === 0.05);
  });

  test('points: documented rules, never negative', function () {
    var P = E.pointsFor;
    assert(P({ correct: false, ms: 1000, streak: 0 }).total === 0, 'wrong = 0');
    assert(P({ correct: true, ms: 6000, statusBefore: 'learning', firstTry: false, improved: false, streak: 1 }).total === 10, 'slow base 10');
    assert(P({ correct: true, ms: 3000, statusBefore: 'learning', firstTry: false, improved: false, streak: 1 }).total === 15, 'fast +5');
    assert(P({ correct: true, ms: 1000, statusBefore: 'learning', firstTry: false, improved: false, streak: 1 }).total === 20, 'very fast +10');
    assert(P({ correct: true, ms: 6000, statusBefore: 'weak', firstTry: true, improved: false, streak: 1 }).total === 20, 'weak first try +10');
    assert(P({ correct: true, ms: 6000, statusBefore: 'weak', firstTry: false, improved: false, streak: 1 }).total === 10, 'no first-try bonus on retry');
    assert(P({ correct: true, ms: 6000, statusBefore: 'learning', firstTry: false, improved: true, streak: 1 }).total === 15, 'improvement +5');
    assert(P({ correct: true, ms: 6000, statusBefore: 'learning', firstTry: false, improved: false, streak: 5 }).total === 15, 'streak 5 = x1.5');
    assert(P({ correct: true, ms: 6000, statusBefore: 'learning', firstTry: false, improved: false, streak: 10 }).total === 20, 'streak 10 = x2');
    assert(P({ correct: true, ms: 6000, statusBefore: 'learning', firstTry: false, improved: false, streak: 100 }).mult === 3, 'multiplier capped at 3');
  });

  test('selection: ~70/20/10 across weak/learning/mastered (within 10 points)', function () {
    var s = E.newState();
    // make 6 known facts mastered, 8 hard facts weak, 2 hard facts + rest learning
    ['3x3','3x4','3x5','4x4','4x5','5x5'].forEach(function (k) { s.facts[k].fastDays = ['a', 'b', 'c']; s.facts[k].score = 1; });
    ['6x6','6x7'].forEach(function (k) { s.facts[k].score = 0.55; });
    var rng = mulberry(7), counts = { weak: 0, learning: 0, mastered: 0 }, recent = [], N = 3000;
    for (var i = 0; i < N; i++) {
      var k = E.pickNext(s, { rng: rng, recent: recent, now: T0 });
      counts[E.statusOf(s, k)]++;
      recent.push(k); if (recent.length > 3) recent.shift();
    }
    var w = counts.weak / N, l = counts.learning / N, m = counts.mastered / N;
    assert(Math.abs(w - 0.7) <= 0.10, 'weak ' + w.toFixed(2));
    assert(Math.abs(l - 0.2) <= 0.10, 'learning ' + l.toFixed(2));
    assert(Math.abs(m - 0.1) <= 0.10, 'mastered ' + m.toFixed(2));
  });

  test('selection: fresh state spends most time on the 10 hard facts', function () {
    var s = E.newState(), rng = mulberry(11), hard = 0, recent = [], N = 2000;
    for (var i = 0; i < N; i++) {
      var k = E.pickNext(s, { rng: rng, recent: recent, now: T0 });
      if (E.isHard(k)) hard++;
      recent.push(k); if (recent.length > 3) recent.shift();
    }
    assert(hard / N >= 0.65, 'hard share ' + (hard / N).toFixed(2));
  });

  test('selection: never repeats the same fact back to back', function () {
    var s = E.newState(), rng = mulberry(3), recent = [], prev = null;
    for (var i = 0; i < 1000; i++) {
      var k = E.pickNext(s, { rng: rng, recent: recent, now: T0 });
      assert(k !== prev, 'repeat at ' + i);
      prev = k; recent.push(k); if (recent.length > 3) recent.shift();
    }
  });

  test('both orders appear (7x8 and 8x7)', function () {
    var rng = mulberry(5), seen = {};
    for (var i = 0; i < 200; i++) { var ab = E.orient('7x8', rng); seen[ab.join('x')] = true; }
    assert(seen['7x8'] && seen['8x7']);
  });

  test('session: warm-up is 3 easy facts first, then 15 questions in total', function () {
    var s = E.newState(), rng = mulberry(21);
    var sess = E.createSession(s, { rng: rng, now: T0 });
    var qs = [], q;
    while ((q = E.nextQuestion(sess, s))) { qs.push(q); E.submitAnswer(sess, s, q, respond(q, true), 2500); }
    assert(qs.length === 15, 'length ' + qs.length);
    for (var i = 0; i < 3; i++) assert(!E.isHard(qs[i].key), 'warm-up ' + qs[i].key);
  });

  test('session: a wrong answer reappears within 5 questions, and the answer is shown', function () {
    for (var seed = 1; seed <= 30; seed++) {
      var s = E.newState(), rng = mulberry(seed);
      var sess = E.createSession(s, { rng: rng, now: T0 });
      var q, idx = 0, wrongAt = {}, checked = 0;
      while ((q = E.nextQuestion(sess, s))) {
        if (wrongAt[q.key] !== undefined && q.retry) {
          assert(idx - wrongAt[q.key] <= 5, 'seed ' + seed + ': ' + q.key + ' came back after ' + (idx - wrongAt[q.key]));
          delete wrongAt[q.key]; checked++;
        }
        var firstSight = !sess.seen[q.key];
        var r = E.submitAnswer(sess, s, q, respond(q, !(firstSight && E.isHard(q.key))), 2500);
        if (!r.correct) {
          assert(r.answer === q.a * q.b, 'shows right answer');
          assert(r.hint && r.hint.length > 5, 'shows hint');
          wrongAt[q.key] = idx;
        }
        idx++;
      }
      assert(Object.keys(wrongAt).length === 0, 'seed ' + seed + ': unreturned ' + Object.keys(wrongAt));
    }
  });

  test('session: wrong answers never reduce points; points only go up', function () {
    var s = E.newState(), rng = mulberry(9);
    var sess = E.createSession(s, { rng: rng, now: T0 }), q, last = 0;
    while ((q = E.nextQuestion(sess, s))) {
      var wrong = sess.asked % 3 === 1;
      E.submitAnswer(sess, s, q, respond(q, !wrong), 2000);
      assert(s.points >= last, 'points dropped');
      last = s.points;
    }
    assert(s.points > 0);
  });

  test('session: streak resets quietly on a miss and builds the multiplier', function () {
    var s = E.newState(), sess = E.createSession(s, { rng: mulberry(2), now: T0 }), q, i;
    for (i = 0; i < 5; i++) { q = E.nextQuestion(sess, s); E.submitAnswer(sess, s, q, respond(q, true), 2500); }
    assert(sess.streak === 5);
    q = E.nextQuestion(sess, s);
    var r = E.submitAnswer(sess, s, q, respond(q, false), 2500);
    assert(sess.streak === 0 && r.points.total === 0);
    assert(sess.bestStreak === 5);
  });

  test('diagnostic: 16 questions, every hard fact once, starts with two easy facts, flat 10 stars per right answer', function () {
    var s = E.newState(), sess = E.createSession(s, { mode: 'diagnostic', rng: mulberry(4), now: T0 }), q, qs = [];
    while ((q = E.nextQuestion(sess, s))) { qs.push(q); E.submitAnswer(sess, s, q, String(q.a * q.b), 3000); }
    assert(qs.length === 16, 'length ' + qs.length);
    var hardSeen = {};
    qs.forEach(function (x) { if (E.isHard(x.key)) hardSeen[x.key] = (hardSeen[x.key] || 0) + 1; });
    assert(Object.keys(hardSeen).length === 10);
    Object.keys(hardSeen).forEach(function (k) { assert(hardSeen[k] === 1, k + ' asked ' + hardSeen[k]); });
    assert(!E.isHard(qs[0].key) && !E.isHard(qs[1].key));
    assert(E.SCOUT_POINTS === 10);
    assert(s.points === 16 * E.SCOUT_POINTS, 'flat 10 per right answer, got ' + s.points);
    var sum = E.finishSession(sess, s, T0 + 100000);
    assert(s.diagnosticDone === true);
    assert(Object.keys(s.baseline).length === 16);
    assert(sum.questions === 16 && sum.correct === 16);
  });

  test('finish: summary lists missed facts, newly mastered and records a session', function () {
    var s = E.newState();
    // pre-load 7x8 to 2 fast days so today's fast answer masters it
    s.facts['7x8'].fastDays = ['2026-11-01', '2026-11-02'];
    var sess = E.createSession(s, { rng: mulberry(8), now: T0 });
    var q = { key: '7x8', a: 7, b: 8, retry: false, index: 0 };
    E.submitAnswer(sess, s, q, '56', 1500, { now: T0 });
    var q2 = { key: '6x9', a: 6, b: 9, retry: false, index: 1 };
    E.submitAnswer(sess, s, q2, '50', 3000, { now: T0 });
    var sum = E.finishSession(sess, s, T0 + 60000);
    assert(sum.newlyMastered.indexOf('7x8') >= 0, 'newly mastered');
    assert(sum.missed.indexOf('6x9') >= 0, 'missed');
    assert(s.sessions.length === 1 && s.sessions[0].q === 2 && s.sessions[0].c === 1);
  });

  test('storage migration: bad or old data resets safely, partial data is repaired', function () {
    assert(E.migrate(null).v === 1);
    assert(E.migrate({ v: 99 }).v === 1);
    var partial = { v: 1, facts: { '3x3': { attempts: 5, correct: 5, times: [], lastSeen: 0, score: 0.9, bestMs: 1000, fastDays: [] } } };
    var m = E.migrate(partial);
    assert(Object.keys(m.facts).length === 28);
    assert(m.facts['3x3'].attempts === 5, 'keeps existing data');
  });

  // ---------- interludes (F24 to F27) ----------
  test('interludes: only the 5th and 10th question of a quest, never in the scout, never the same format twice in a row', function () {
    for (var seed = 1; seed <= 60; seed++) {
      var s = E.newState(), sess = E.createSession(s, { rng: mulberry(seed), now: T0 }), q, idx = 0, found = [];
      while ((q = E.nextQuestion(sess, s))) {
        if (q.interlude) found.push({ idx: idx, type: q.interlude.type });
        E.submitAnswer(sess, s, q, respond(q, true), 2500); idx++;
      }
      assert(found.length === 2, 'seed ' + seed + ': ' + found.length + ' interludes');
      assert(found[0].idx === 4 && found[1].idx === 9, 'seed ' + seed + ' slots ' + found[0].idx + ',' + found[1].idx);
      assert(found[0].type !== found[1].type, 'seed ' + seed + ' repeated format');
    }
    var s2 = E.newState(), d = E.createSession(s2, { mode: 'diagnostic', rng: mulberry(1), now: T0 }), q2;
    while ((q2 = E.nextQuestion(d, s2))) { assert(!q2.interlude, 'no interlude in scout'); E.submitAnswer(d, s2, q2, respond(q2, true), 2000); }
  });

  test('interludes: all three formats appear across many quests', function () {
    var seen = {};
    for (var seed = 1; seed <= 60; seed++) {
      var s = E.newState(), sess = E.createSession(s, { rng: mulberry(seed * 7), now: T0 }), q;
      while ((q = E.nextQuestion(sess, s))) { if (q.interlude) seen[q.interlude.type] = true; E.submitAnswer(sess, s, q, respond(q, true), 2500); }
    }
    assert(seen.firefly && seen.spot && seen.missing, JSON.stringify(seen));
  });

  test('firefly: 4 unique positive options, exactly one is the product, for every pair in both orders', function () {
    for (var seed = 1; seed <= 5; seed++) {
      var rng = mulberry(seed);
      for (var a = 3; a <= 9; a++) for (var b = 3; b <= 9; b++) {
        var p = a * b, d = E.distractors(a, b, 3, rng);
        assert(d.length === 3, a + 'x' + b + ' needs 3 distractors');
        var all = [p].concat(d);
        all.forEach(function (v) { assert(v > 0 && Math.floor(v) === v, 'positive integer ' + v); });
        assert(new Set(all).size === 4, a + 'x' + b + ' options not unique: ' + all);
        assert(d.indexOf(p) < 0, 'distractor equals product');
      }
    }
  });

  test('firefly, spot and missing: every question is mathematically right, for every fact', function () {
    var types = { firefly: 0, spot: 0, missing: 0 };
    for (var seed = 1; seed <= 40; seed++) {
      var rng = mulberry(seed);
      E.ALL.forEach(function (k) {
        var ab = E.orient(k, rng), a = ab[0], b = ab[1];
        ['firefly', 'spot', 'missing'].forEach(function (t) {
          var s = E.newState(), sess = E.createSession(s, { rng: rng, now: T0 });
          var q = { key: k, a: a, b: b, retry: false, index: 4, interlude: null };
          // build through the public path: force a slot by advancing to question 5 is covered above; here test checkers directly
          var itw;
          if (t === 'firefly') itw = { type: t, options: [a * b].concat(E.distractors(a, b, 3, rng)) };
          else if (t === 'spot') itw = { type: t, isCorrect: true, shown: a * b };
          else itw = { type: t };
          q.interlude = itw;
          var good = E.submitAnswer(sess, s, q, respond(q, true), 1000);
          assert(good.correct, k + ' ' + t + ' right response rejected');
          var q2 = { key: k, a: a, b: b, retry: false, index: 5, interlude: itw };
          var bad = E.submitAnswer(sess, s, q2, respond(q2, false), 1000);
          assert(!bad.correct, k + ' ' + t + ' wrong response accepted');
          types[t]++;
        });
      });
    }
    assert(types.firefly > 0 && types.spot > 0 && types.missing > 0);
  });

  test('spot the mistake: a "wrong" equation shown is never the true product', function () {
    for (var seed = 1; seed <= 300; seed++) {
      var s = E.newState(), sess = E.createSession(s, { rng: mulberry(seed), now: T0 }), q;
      while ((q = E.nextQuestion(sess, s))) {
        if (q.interlude && q.interlude.type === 'spot') {
          var it = q.interlude, p = q.a * q.b;
          assert(it.isCorrect === (it.shown === p), 'seed ' + seed + ': flag disagrees with equation');
        }
        E.submitAnswer(sess, s, q, respond(q, true), 2000);
      }
    }
  });

  test('missing number: typed factor times the other factor equals the product', function () {
    for (var seed = 1; seed <= 100; seed++) {
      var s = E.newState(), sess = E.createSession(s, { rng: mulberry(seed), now: T0 }), q;
      while ((q = E.nextQuestion(sess, s))) {
        if (q.interlude && q.interlude.type === 'missing') {
          var typed = Number(respond(q, true));
          assert(typed * q.b === q.a * q.b && typed >= 3 && typed <= 9, 'seed ' + seed);
        }
        E.submitAnswer(sess, s, q, respond(q, true), 2000);
      }
    }
  });

  test('F27: interlude answers never change mastery; a miss queues a retry; a hit earns 25 stars', function () {
    var s = E.newState(), sess = E.createSession(s, { rng: mulberry(1), now: T0 });
    var before = JSON.stringify(s.facts);
    var q = { key: '7x8', a: 7, b: 8, retry: false, index: 4, interlude: { type: 'firefly', options: [56, 54, 63, 48] } };
    var r = E.submitAnswer(sess, s, q, 56, 900);
    assert(r.correct && r.points.total === 25 && s.points === 25 && sess.points === 25);
    var q2 = { key: '6x9', a: 6, b: 9, retry: false, index: 9, interlude: { type: 'spot', isCorrect: false, shown: 56 } };
    var r2 = E.submitAnswer(sess, s, q2, true, 900); // says "right" but 6x9 = 54, not 56
    assert(!r2.correct && r2.points.total === 0 && s.points === 25, 'miss earns nothing and loses nothing');
    assert(sess.retries.some(function (x) { return x.key === '6x9'; }), 'miss queued');
    assert(JSON.stringify(s.facts) === before, 'fact data changed by interludes');
  });

  test('mastered flag fires once, when the third fast day lands', function () {
    var s = E.newState(), sess = E.createSession(s, { rng: mulberry(1), now: T0 });
    s.facts['7x8'].fastDays = ['2026-11-01', '2026-11-02'];
    var r = E.submitAnswer(sess, s, { key: '7x8', a: 7, b: 8, retry: false, index: 0 }, '56', 1500, { now: T0 });
    assert(r.mastered === true, 'flag should fire');
    var r2 = E.submitAnswer(sess, s, { key: '7x8', a: 7, b: 8, retry: false, index: 1 }, '56', 1500, { now: T0 + 1000 });
    assert(r2.mastered === false, 'flag should not fire again');
  });

  // ---------- music, voice, dance break ----------
  test('music: track changes every 5 minutes, cycles through all tracks', function () {
    var M = 5 * 60 * 1000;
    assert(E.MUSIC_SWAP_MS === M);
    assert(E.trackIndexFor(0, 4) === 0 && E.trackIndexFor(M - 1, 4) === 0, 'first 5 minutes = track 0');
    assert(E.trackIndexFor(M, 4) === 1 && E.trackIndexFor(2 * M, 4) === 2 && E.trackIndexFor(3 * M, 4) === 3);
    assert(E.trackIndexFor(4 * M, 4) === 0, 'wraps after the last track');
    assert(E.trackIndexFor(-5, 4) === 0, 'negative time is safe');
  });

  test('voice: sentence for every pair reads the right product', function () {
    for (var a = 3; a <= 9; a++) for (var b = 3; b <= 9; b++) {
      assert(E.spokenText(a, b) === a + ' times ' + b + ' equals ' + (a * b));
    }
  });

  test('cheer lines: every template, every pair says the right equation and product', function () {
    assert(E.CHEERS.length >= 10, 'enough variety');
    E.CHEERS.forEach(function (t) { assert(t.indexOf('{eq}') >= 0, 'template needs {eq}: ' + t); });
    for (var a = 3; a <= 9; a++) for (var b = 3; b <= 9; b++) {
      for (var i = 0; i < E.CHEERS.length; i++) {
        var line = E.cheerLine(a, b, function () { return i / E.CHEERS.length; });
        assert(line.indexOf(a + ' times ' + b + ' is ' + (a * b)) >= 0, line);
        assert(line.indexOf('{eq}') < 0, 'placeholder left in: ' + line);
      }
    }
    var seen = {}; var rng = mulberry(2);
    for (var j = 0; j < 200; j++) seen[E.cheerLine(7, 8, rng)] = true;
    assert(Object.keys(seen).length >= 10, 'lines vary');
  });

  test('dance break: every 5th correct answer in a row, in quests only, never on a miss or in the scout', function () {
    var D = E.isDanceBreak;
    [5, 10, 15].forEach(function (n) { assert(D({ correct: true, streak: n }, 'play'), 'streak ' + n); });
    [0, 1, 4, 6, 9, 11].forEach(function (n) { assert(!D({ correct: true, streak: n }, 'play'), 'no dance at ' + n); });
    assert(!D({ correct: false, streak: 0 }, 'play'), 'miss');
    assert(!D({ correct: true, streak: 5 }, 'diagnostic'), 'not in the scout');
  });

  test('dance break fires exactly 3 times in a perfect 15-question quest', function () {
    var s = E.newState(), sess = E.createSession(s, { rng: mulberry(5), now: T0 }), q, dances = 0;
    while ((q = E.nextQuestion(sess, s))) {
      var r = E.submitAnswer(sess, s, q, respond(q, true), 2500);
      if (E.isDanceBreak(r, sess.mode)) dances++;
    }
    assert(dances === 3, 'dances ' + dances);
  });

  test('settings: voice defaults on, and old saves without it are upgraded', function () {
    assert(E.newState().settings.voice === true);
    var old = { v: 1, facts: {}, settings: { sfx: false, music: false } };
    var m = E.migrate(old);
    assert(m.settings.voice === true && m.settings.sfx === false && m.settings.music === false, 'keeps old choices');
  });

  // ---------- prizes and trophy board ----------
  function playQuest(s, seed, day, speedMs) {
    var sess = E.createSession(s, { rng: mulberry(seed), now: T0 + day * DAY }), q;
    while ((q = E.nextQuestion(sess, s))) E.submitAnswer(sess, s, q, respond(q, true), speedMs);
    return E.finishSession(sess, s, T0 + day * DAY + 300000);
  }

  test('prizes: 1,000 stars = bubble tea, 10,000 stars = big surprise', function () {
    assert(E.PRIZES.length === 2);
    assert(E.PRIZES[0].stars === 1000 && E.PRIZES[0].name === 'Bubble tea');
    assert(E.PRIZES[1].stars === 10000 && E.PRIZES[1].name === 'Big surprise');
  });

  test('prize progress: remaining, percentage, and what is won', function () {
    var p0 = E.prizeProgress(0);
    assert(p0.next.stars === 1000 && p0.remaining === 1000 && p0.pct === 0 && p0.reached.length === 0);
    var p1 = E.prizeProgress(400);
    assert(p1.remaining === 600 && Math.abs(p1.pct - 0.4) < 1e-9);
    var p2 = E.prizeProgress(1000);
    assert(p2.reached.length === 1 && p2.next.stars === 10000 && p2.remaining === 9000 && p2.pct === 0, 'bar restarts for next prize');
    var p3 = E.prizeProgress(5500);
    assert(p3.remaining === 4500 && Math.abs(p3.pct - 0.5) < 1e-9);
    var p4 = E.prizeProgress(12000);
    assert(p4.reached.length === 2 && p4.next === null && p4.remaining === 0 && p4.pct === 1);
  });

  test('prizes crossed: only prizes passed during this quest', function () {
    assert(E.prizesCrossed(900, 1100).length === 1 && E.prizesCrossed(900, 1100)[0].stars === 1000);
    assert(E.prizesCrossed(1000, 1500).length === 0, 'already won before');
    assert(E.prizesCrossed(0, 12000).length === 2, 'both at once');
    assert(E.prizesCrossed(500, 999).length === 0);
  });

  test('quests save stars and best streak; trophy board ranks them, best first', function () {
    var s = E.newState();
    playQuest(s, 1, 0, 6000);   // slow: fewer stars
    playQuest(s, 2, 1, 1500);   // fast: more stars
    playQuest(s, 3, 2, 3000);
    var last = s.sessions[s.sessions.length - 1];
    assert(typeof last.pts === 'number' && last.pts > 0 && typeof last.bs === 'number', 'saved pts and bs');
    var total = s.sessions.reduce(function (a, x) { return a + x.pts; }, 0);
    assert(total === s.points, 'quest stars add up to the lifetime total: ' + total + ' vs ' + s.points);
    var lb = E.leaderboard(s);
    assert(lb.ranked.length === 3 && lb.history.length === 3);
    for (var i = 1; i < 3; i++) assert(lb.ranked[i - 1].pts >= lb.ranked[i].pts, 'sorted best first');
    assert(lb.ranked[0].rank === 1 && lb.ranked[0].pts === s.bestPoints, 'best matches bestPoints');
    assert(lb.history[0].idx === 2, 'history is newest first');
    assert(lb.ranked[0].pts > lb.ranked[2].pts, 'fast quest beats slow quest');
  });

  test('trophy board: scout (diagnostic) and old saves without stars are left out', function () {
    var s = E.newState();
    var sc = E.createSession(s, { rng: mulberry(5), now: T0, mode: 'diagnostic' }), q;
    while ((q = E.nextQuestion(sc, s))) E.submitAnswer(sc, s, q, respond(q, true), 2500);
    E.finishSession(sc, s, T0 + 1000);
    s.sessions.push({ date: '2026-11-01', ms: 1000, q: 15, c: 12, mode: 'play' });
    assert(E.leaderboard(s).ranked.length === 0, 'neither counts');
    assert(s.bestPoints === undefined || s.bestPoints === 0, 'scout does not set a best');
    playQuest(s, 6, 3, 2500);
    assert(E.leaderboard(s).ranked.length === 1);
  });

  test('scout stars: flat 10 whatever the speed or streak, 0 for a miss, never negative', function () {
    var s = E.newState(), sess = E.createSession(s, { mode: 'diagnostic', rng: mulberry(8), now: T0 }), q, i = 0, last = 0, rights = 0;
    while ((q = E.nextQuestion(sess, s))) {
      var ok = i % 3 !== 2, ms = [800, 3500, 12000][i % 3];
      var r = E.submitAnswer(sess, s, q, respond(q, ok), ms);
      assert(r.points.total === (ok ? 10 : 0), 'q' + i + ' got ' + r.points.total);
      assert(s.points >= last, 'never drops'); last = s.points;
      if (ok) rights++;
      i++;
    }
    var sum = E.finishSession(sess, s, T0 + 60000);
    assert(sum.points === rights * 10 && s.points === rights * 10, 'summary and total match');
    assert(E.leaderboard(s).ranked.length === 0, 'scout stays off the trophy board');
    assert(!s.bestPoints, 'scout does not set best quest');
  });

  test('migration: old saves get bestPoints 0 and keep their stars', function () {
    var m = E.migrate({ v: 1, facts: {}, points: 340, settings: { sfx: true, music: true } });
    assert(m.bestPoints === 0 && m.points === 340);
  });

  test('pacing: a fast, accurate player wins the bubble tea in a handful of quests', function () {
    var s = E.newState(), n = 0;
    while (s.points < 1000 && n < 40) { playQuest(s, 100 + n, n, 2500); n++; }
    assert(n >= 2 && n <= 12, 'bubble tea after ' + n + ' quests');
    var per = s.points / n;
    window.__perQuest = Math.round(per);
  });

  var failed = results.filter(function (r) { return !r.ok; });
  var out = document.getElementById('out');
  results.forEach(function (r) {
    var li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = (r.ok ? 'PASS  ' : 'FAIL  ') + r.name + (r.ok ? '' : '  ->  ' + r.msg);
    out.appendChild(li);
  });
  var text = (results.length - failed.length) + ' of ' + results.length + ' passed';
  document.getElementById('summary').textContent = text;
  window.__testSummary = { total: results.length, failed: failed.map(function (r) { return r.name + ': ' + r.msg; }) };
})();
</script>
